version: '3.8'

# Batch W (2026-06-17): POSTGRES_PASSWORD 改读 env var, 不再硬编码明文密码到 git.
# 运维需在 .env (与 docker-compose.yml 同目录) 或 shell 显式 export:
#   POSTGRES_PASSWORD=<rotate 后的强密码>
# 启动前用 docker-compose config 验证替换正确.
services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: stock_postgres
    environment:
      POSTGRES_DB: stock_backtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD env not set; refusing to start with empty/default password}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  stock_network:
    driver: bridge