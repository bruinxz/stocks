# nginx server block for stocks backend + frontend
#
# 上线 launch-helper：把 docs/QMT_PTRADE_LIVE_TRADING_ROADMAP.md §7.4.2 timeout 表
# 直接落成可用配置。bridge 路由单独 location 覆盖 timeout，避免影响其它 API。
#
# 使用：
#   1. 拷贝到 /etc/nginx/sites-available/stocks.conf
#   2. 改三处：server_name / ssl_certificate / proxy_pass 端口
#   3. ln -s /etc/nginx/sites-available/stocks.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 假设 backend 跑 127.0.0.1:3000，前端静态文件 by pm2 serve 跑 127.0.0.1:3001。
# lym sandbox 把 3000/3001 换成 3010/3011 即可。

# ----- HTTP → HTTPS redirect -----
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

# ----- HTTPS server -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：只在确认 HTTPS 稳定后再打开，避免回退到 HTTP 时被锁死
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    # ------------------------------------------------------------------
    # bridge 路由：长轮询 + SSE，必须独立 timeout + 关 buffering
    # docs/QMT_PTRADE_LIVE_TRADING_ROADMAP.md §7.4.2
    # ------------------------------------------------------------------
    location /api/live-trading/bridge/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # bridge 长轮询默认 wait=30s，给 10s 缓冲
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
        proxy_connect_timeout 10s;

        # SSE / 长连接关键：关闭缓冲，事件立刻 flush
        proxy_buffering off;
        proxy_cache off;
        # 配合 backend BridgeController 给 SSE 设置的 X-Accel-Buffering: no
        # 这里再加一道防御：万一某天 Express 漏写，nginx 仍然不缓存
        add_header X-Accel-Buffering no always;
    }

    # ------------------------------------------------------------------
    # 业务 API：常规 60s 超时
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    # 健康检查：低 timeout，独占
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # ------------------------------------------------------------------
    # 上传：放在 /uploads，避免和 SPA 路由冲突
    # ------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # 前端 SPA：先转 pm2 serve；不存在再 fallback /index.html
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # 显式拒绝爬虫扫描常见敏感路径
    # ------------------------------------------------------------------
    location ~* /\.(git|env|aws|ssh) { deny all; return 404; }
    location ~* /(README|CHANGELOG)\.md$ { deny all; return 404; }
}
