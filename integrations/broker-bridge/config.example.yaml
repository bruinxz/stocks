# 本地桥配置示例。复制为 config.yaml 并填入真实值；config.yaml 已 gitignore。
server_base_url: "https://your-domain.com/api/live-trading/bridge"
bridge_key: "local-qmt-001"
bridge_secret: "change_me_to_long_random_secret"

# US-109 [EX-009] 签名方式. "hmac" (缺省, 兼容老 bridge) 或 "ed25519" (非对称, 推荐).
# ed25519 优势: bridge 持私钥, server 仅持公钥; 即使 server env/DB 泄露也无法伪造命令.
# 切换步骤:
#   1) bridge 机器生成 ed25519 keypair (例:
#      python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; \
#                 from cryptography.hazmat.primitives.serialization import Encoding,PrivateFormat,NoEncryption; \
#                 k=Ed25519PrivateKey.generate(); \
#                 print('priv_hex=',k.private_bytes(Encoding.Raw,PrivateFormat.Raw,NoEncryption()).hex())")
#   2) 把私钥 hex 填到 ed25519_private_key, 把派生公钥 hex 配到 server
#      LIVE_BRIDGE_ED25519_PUBKEYS={"local-qmt-001":"<pub_hex_64chars>"}
#   3) signature_method 切到 "ed25519"; bridge_secret 字段仍保留 (兼容老 bridge 回退)
signature_method: "hmac"
ed25519_private_key: ""  # 仅 signature_method=ed25519 时必填; hex / base64 / PEM 三选一

broker_type: "qmt" # qmt | ptrade
qmt_userdata_path: "C:/迅投极速策略交易系统/userdata"
qmt_account_id: "1234567890"

account_id_masked: "****1234"

# 拉取与推送节奏
long_poll_seconds: 30
snapshot_interval_seconds: 30
heartbeat_interval_seconds: 15

# 风控本地兜底
max_single_order_amount: 10000

# readonly_only=true → bridge 不去 pull 命令通道（最强只读，不会产生任何 dry-run 事件）
# allow_order_execution=false → bridge 收到命令也走 dry-run（用前缀 broker_order_id，
#                                server 端会识别并标 failed，不会污染 live_orders.broker_order_id）
# 与 server 端 LIVE_ORDER_EXECUTION_ENABLED 是双开关：任一为 false 即禁止真实下单
readonly_only: true
allow_order_execution: false

# 本地 kill switch 文件路径；存在即熔断
local_kill_switch_file: "./KILL_SWITCH_ON"

# event_seq 持久化路径
event_seq_state_file: "./var/seq.last"

# NTP 校时阈值，启动时偏差超过此值（秒）即拒绝启动
clock_skew_startup_threshold_seconds: 30
