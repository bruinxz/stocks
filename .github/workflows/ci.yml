# GitHub Actions CI 流水线 (US-069 / US-131 matrix 升级)
#
# 触发：push 到任何分支 + PR 到 main
# 三个 job 并行（互不阻塞）:
#   - backend-check:  typecheck + lint + test
#   - frontend-check: typecheck + lint + test + build
#   - docker-check:   docker-compose config validate
# 任一 job failure 均 block PR（PR 事件下 needs-block 会强制 require 这些 check）。
#
# 设计原则：
#   - PR 提早暴露问题（包括 push 到 feature 分支也跑，避免 PR 时才发现）
#   - 缓存 npm 依赖按 package-lock.json hash（actions/setup-node 的 cache 选项）
#   - 任一 job 失败必须有 PR 评论附关键错误片段，方便开发者一眼看到失败位置
#   - backend-check 不依赖 PG/Redis：所有测试遵循 DB-less 单测约定（fake DataSource）
#   - paths-filter：仅当对应目录文件变更时跑对应 job，省 CI 时间（main/PR 总是跑）
#   - frontend test 用 `CI=true` 触发 react-scripts 一次性 jest run（非 watch），
#     `--passWithNoTests` 保证仓库里暂无 *.test.* 时也能 exit 0；后续补完测试自动启用
#   - docker-check 在没有 Dockerfile 的当下只验 `docker compose config` —— 任何 env
#     占位符未填写 (${POSTGRES_PASSWORD:?...}) 或 YAML 语法回归都会立刻 fail
#
# 历史：security-lint.yml 是另一个独立 workflow（无关 typecheck/lint/test）共存即可。

name: CI

on:
  push:
    branches:
      - '**'  # 任何分支 push 都跑
  pull_request:
    branches:
      - main

# 同分支重复 push 取消旧的跑（节省 CI runner 时间）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 路径过滤：探测哪些目录发生变更，让下游 job 决定是否跑
  # --------------------------------------------------------------------------
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - '.github/workflows/ci.yml'

  # --------------------------------------------------------------------------
  # backend-check: cd backend && npm ci && npx tsc --noEmit && npm run lint && npm test
  # --------------------------------------------------------------------------
  backend-check:
    name: Backend check (typecheck + lint + test)
    needs: detect-changes
    # 当 backend 有变更，或事件是 PR 时总是跑（PR 必须全绿才能合并）
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 按 backend/package-lock.json hash 缓存 ~/.npm
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Diagnostic baseline comparator regression guard
        run: |
          cd ..
          node scripts/ci/diagnostic-baseline.test.js

      # P0 regression guard: every producer piped through tee must preserve its
      # exit status. This step parses this workflow, proves an unsafe mutation is
      # rejected, and exercises both failing and passing producers with logs.
      - name: CI tee exit-code regression guard
        id: tee_exit_guard
        run: |
          set -o pipefail
          ruby <<'RUBY'
          require 'yaml'

          workflow_path = '../.github/workflows/ci.yml'
          workflow = YAML.safe_load(File.read(workflow_path), aliases: true)
          unless workflow.is_a?(Hash) && workflow['jobs'].is_a?(Hash)
            raise 'ci.yml did not parse into a workflow with jobs'
          end

          tee_word = %w[t e e].join
          tee_pipeline_pattern = Regexp.new("\\|\\s*#{tee_word}(?:\\s|$)")
          pipefail_on_pattern = /^\s*set\s+-o\s+pipefail\s*(?:#.*)?$/
          pipefail_off_pattern = /^\s*set\s+\+o\s+pipefail\s*(?:#.*)?$/
          immediate_pipe_status_pattern =
            /^\s*[A-Za-z_][A-Za-z0-9_]*\s*=\s*["']?\$\{PIPESTATUS\s*\[\s*0\s*\]\}["']?\s*(?:#.*)?$/
          meaningful_command = lambda do |line|
            stripped = line.strip
            !stripped.empty? && !stripped.start_with?('#')
          end

          inspect_workflow = lambda do |document|
            violations = []
            pipeline_count = 0
            document.fetch('jobs', {}).each do |job_name, job|
              job.fetch('steps', []).each_with_index do |step, step_index|
                next unless step['run'].is_a?(String)

                lines = step['run'].lines.map(&:chomp)
                pipefail_active = false
                lines.each_with_index do |line, line_index|
                  if pipefail_on_pattern.match?(line)
                    pipefail_active = true
                    next
                  end
                  if pipefail_off_pattern.match?(line)
                    pipefail_active = false
                    next
                  end
                  next unless tee_pipeline_pattern.match?(line)

                  pipeline_count += 1
                  immediate_line = lines[(line_index + 1)..]&.find do |candidate|
                    meaningful_command.call(candidate)
                  end
                  captures_producer_status =
                    immediate_line && immediate_pipe_status_pattern.match?(immediate_line)

                  unless pipefail_active || captures_producer_status
                    reason = if immediate_line&.include?('PIPESTATUS')
                      'PIPESTATUS[0] capture is not an immediate assignment'
                    elsif immediate_line
                      "pipefail inactive and next command is #{immediate_line.strip.inspect}"
                    else
                      'pipefail inactive and producer status is not captured'
                    end
                    violations << [
                      job_name,
                      step['name'] || "step-#{step_index + 1}",
                      "line #{line_index + 1}",
                      reason,
                    ].join('/')
                  end
                end
              end
            end
            { pipeline_count: pipeline_count, violations: violations }
          end

          current = inspect_workflow.call(workflow)
          unless current[:violations].empty?
            raise "tee pipelines can mask producer failures:\n#{current[:violations].join("\n")}"
          end

          mutated = Marshal.load(Marshal.dump(workflow))
          happy_step = mutated.fetch('jobs').fetch('backend-check').fetch('steps').find do |step|
            step['name'] == 'Env validation (check-env, happy path)'
          end
          unless happy_step && happy_step['run'].is_a?(String)
            raise 'mutation target step not found'
          end
          happy_step['run'] = happy_step['run'].sub(/^\s*set\s+-o\s+pipefail\s*\n/, '')
          mutation_result = inspect_workflow.call(mutated)
          unless mutation_result[:violations].any? do |violation|
            violation.include?('Env validation (check-env, happy path)')
          end
            raise 'static guard failed to reject missing pipefail'
          end

          pipefail_disabled = Marshal.load(Marshal.dump(workflow))
          disabled_step = pipefail_disabled.fetch('jobs').fetch('backend-check').fetch('steps').find do |step|
            step['name'] == 'Env validation (check-env, happy path)'
          end
          disabled_step['run'] = disabled_step['run'].sub(
            /^\s*set\s+-o\s+pipefail\s*\n/,
            "set -o pipefail\nset +o pipefail\n",
          )
          disabled_result = inspect_workflow.call(pipefail_disabled)
          unless disabled_result[:violations].any? do |violation|
            violation.include?('Env validation (check-env, happy path)')
          end
            raise 'static guard failed to reject pipefail disabled before tee'
          end

          delayed_capture = Marshal.load(Marshal.dump(workflow))
          negative_env_step = delayed_capture.fetch('jobs').fetch('backend-check').fetch('steps').find do |step|
            step['name'] == 'Env validation (check-env, fail-fast on missing env)'
          end
          delayed_lines = negative_env_step.fetch('run').lines
          negative_tee_index = delayed_lines.index do |line|
            tee_pipeline_pattern.match?(line)
          end
          raise 'negative-env tee pipeline not found' unless negative_tee_index

          delayed_lines.insert(negative_tee_index + 1, "true\n")
          negative_env_step['run'] = delayed_lines.join
          delayed_result = inspect_workflow.call(delayed_capture)
          unless delayed_result[:violations].any? do |violation|
            violation.include?('Env validation (check-env, fail-fast on missing env)')
          end
            raise 'static guard failed to reject delayed PIPESTATUS[0] capture'
          end

          docker_job = workflow.fetch('jobs').fetch('docker-check')
          docker_step = docker_job.fetch('steps').find do |step|
            step['name'] == 'Validate docker-compose.yml'
          end
          docker_upload = docker_job.fetch('steps').find do |step|
            step['name'] == 'Upload logs on failure'
          end
          expected_docker_pipeline = ['|', 'tee', 'docker-compose-config.log'].join(' ')
          unless docker_step&.fetch('run', '')&.include?(expected_docker_pipeline)
            raise 'docker compose producer must write docker-compose-config.log in workspace root'
          end
          upload_path = docker_upload&.dig('with', 'path').to_s
          unless upload_path.lines.map(&:strip).include?('docker-compose-config.log')
            raise 'docker compose failure artifact must upload docker-compose-config.log'
          end

          puts "ci.yml parsed; #{current[:pipeline_count]} tee pipeline(s) preserve producer status"
          puts 'missing/disabled pipefail mutations rejected as expected'
          puts 'delayed PIPESTATUS[0] mutation rejected as expected'
          puts 'docker compose log path matches failure artifact'
          RUBY

          set +e
          bash -c 'printf "%s\n" "controlled producer failure"; exit 23' 2>&1 \
            | tee ../ci-pipefail-fail-probe.log
          fail_rc=$?
          set -e
          if [ "$fail_rc" -ne 23 ]; then
            echo "::error::failing producer exit was masked (expected 23, got $fail_rc)"
            exit 1
          fi
          grep -Fq "controlled producer failure" ../ci-pipefail-fail-probe.log

          set +e
          bash -c 'printf "%s\n" "controlled producer success"' 2>&1 \
            | tee ../ci-pipefail-pass-probe.log
          pass_rc=$?
          set -e
          if [ "$pass_rc" -ne 0 ]; then
            echo "::error::passing producer returned unexpected exit $pass_rc"
            exit 1
          fi
          grep -Fq "controlled producer success" ../ci-pipefail-pass-probe.log

      # US-001 (OPS-001) env 校验脚本：CI 跑一遍 check-env，确保 EnvValidator
      # schema 与现有 .env / 部署文档同步。注入"production-grade 合法 env 子集"
      # （DB+Redis+JWT+TRADING_AGENTS_URL）让脚本能完整跑到 exit=0；未来任何
      # 新增 required 字段忘了同步 .env.example 时，CI 立刻 fail。
      # 另跑一次 missing-env 子步骤验证 fail-fast 路径（exit=1），双向保证。
      - name: Env validation (check-env, happy path)
        id: env_check
        env:
          NODE_ENV: production
          DB_HOST: ci-postgres
          DB_NAME: ci_stocks
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          REDIS_HOST: ci-redis
          JWT_SECRET: ci-only-jwt-secret-32chars-min-do-not-deploy-aaaaaaaaaaaaaaaa
          TRADING_AGENTS_URL: http://trading-agents.internal:8000
        run: |
          set -o pipefail
          npm run check-env 2>&1 | tee ../backend-envcheck.log
        continue-on-error: false

      - name: Env validation (check-env, fail-fast on missing env)
        id: env_check_fail
        # 反向用例：清掉关键 env 后必须 exit=1。任何回归（schema required 字段
        # 漏标 .required(), 或 dotenv 把空串当合法值）此处会爆掉。
        run: |
          set +e
          env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production \
            npx ts-node --transpile-only src/scripts/check-env.ts 2>&1 \
            | tee ../backend-envcheck-fail.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-env should exit=1 when required env is missing (got exit=$rc)"
            exit 1
          fi
          echo "check-env correctly exited with 1 on missing env"

      - name: Typecheck (tsc --noEmit)
        id: typecheck
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee ../backend-typecheck.log
        continue-on-error: false

      # US-098 (OPS-009) OpenAPI 自动生成 drift guard：跑 `buildOpenApiSpec()` 与
      # 已提交的 `docs/openapi.json` 做 byte-for-byte 对比。任何 routes/*.ts 修改
      # @openapi JSDoc 但忘了重跑 `npm run docs:openapi` 的 PR 都会在此挂掉，
      # 并打印第一处差异位置 + 修复命令提示。不依赖 DB / 任何外部服务。
      - name: OpenAPI drift check (docs/openapi.json ↔ code)
        id: openapi_check
        run: |
          set -o pipefail
          npm run docs:openapi:check 2>&1 | tee ../backend-openapi-check.log
        continue-on-error: false

      # Phase 0 hardening: architecture drift guard. Existing cycles / layer
      # violations are recorded in scripts/ci/architecture-baseline.json; strict
      # mode fails only when a PR introduces new unbaselined debt.
      - name: Architecture drift check
        id: architecture_check
        run: |
          set -o pipefail
          node ../scripts/ci/check_architecture.js --strict --baseline ../scripts/ci/architecture-baseline.json 2>&1 | tee ../backend-architecture-check.log
        continue-on-error: false

      - name: Lint (eslint)
        id: lint
        run: |
          set -o pipefail
          set +e
          npx eslint src --ext .ts --format json > ../backend-lint.json 2> ../backend-lint.stderr
          lint_rc=$?
          set -e
          eslint_version=$(npx eslint --version)
          eslint_version=${eslint_version#v}
          if [ -s ../backend-lint.stderr ]; then
            cat ../backend-lint.stderr | tee ../backend-lint.log
          fi
          node ../scripts/ci/diagnostic-baseline.js compare \
            --baseline ../docs/refactor/baseline/ci/backend-eslint-da801a52.json \
            --input ../backend-lint.json \
            --tool-version "$eslint_version" \
            --producer-exit "$lint_rc" \
            --repo-root .. \
            --workdir backend \
            --summary ../backend-lint-baseline-summary.json 2>&1 | tee -a ../backend-lint.log
        continue-on-error: false

      - name: Upload backend lint baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-baseline-${{ github.run_attempt }}
          path: |
            backend-lint.json
            backend-lint.stderr
            backend-lint.log
            backend-lint-baseline-summary.json
          retention-days: 7

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../backend-test.log
        continue-on-error: false

      # 失败时上传日志 + 在 PR 上评论关键错误片段
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend-envcheck.log
            backend-envcheck-fail.log
            ci-pipefail-fail-probe.log
            ci-pipefail-pass-probe.log
            backend-typecheck.log
            backend-openapi-check.log
            backend-architecture-check.log
            backend-lint.json
            backend-lint.log
            backend-lint.stderr
            backend-lint-baseline-summary.json
            backend-test.log
          retention-days: 7

      - name: Comment on PR with errors
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logs = ['envcheck', 'envcheck-fail', 'typecheck', 'openapi-check', 'architecture-check', 'lint', 'test'];
            const sections = [];
            for (const name of logs) {
              const filePath = path.join(process.env.GITHUB_WORKSPACE, `backend-${name}.log`);
              if (!fs.existsSync(filePath)) continue;
              const content = fs.readFileSync(filePath, 'utf-8');
              // 取尾部 60 行（错误一般在尾部）
              const tail = content.split('\n').slice(-60).join('\n');
              sections.push(`<details><summary><b>backend ${name}</b> (tail 60 lines)</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>`);
            }
            const body = `## ❌ Backend CI failed\n\n${sections.join('\n\n')}\n\n_See full logs in [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # --------------------------------------------------------------------------
  # frontend-check: cd frontend && npm ci && tsc --noEmit && npm run lint
  # --------------------------------------------------------------------------
  frontend-check:
    name: Frontend check (typecheck + lint)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        id: typecheck
        run: |
          set -o pipefail
          set +e
          npx tsc --noEmit --pretty false > ../frontend-typecheck.log 2>&1
          tsc_rc=$?
          set -e
          tsc_version=$(npx tsc --version)
          tsc_version=${tsc_version#Version }
          cat ../frontend-typecheck.log
          node ../scripts/ci/diagnostic-baseline.js compare \
            --baseline ../docs/refactor/baseline/ci/frontend-tsc-da801a52.json \
            --input ../frontend-typecheck.log \
            --tool-version "$tsc_version" \
            --producer-exit "$tsc_rc" \
            --repo-root .. \
            --workdir frontend \
            --summary ../frontend-typecheck-baseline-summary.json 2>&1 | tee -a ../frontend-typecheck.log
        continue-on-error: false

      - name: Upload frontend typecheck baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-baseline-${{ github.run_attempt }}
          path: |
            frontend-typecheck.log
            frontend-typecheck-baseline-summary.json
          retention-days: 7

      - name: Lint (eslint)
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../frontend-lint.log
        continue-on-error: false

      # US-131 (OPS-012) frontend test 加入 CI matrix。React-scripts 基于 jest，
      # 在 CI=true 环境下默认非 watch 一次性跑完；--passWithNoTests 让仓库当前
      # 还没补 *.test.* 文件时也能 exit 0，后续逐步补测试自动启用。任何回归
      # （test 报错 / 引用缺失文件）此处会爆掉。
      - name: Test (jest via react-scripts)
        id: test
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npm test -- --watchAll=false --passWithNoTests 2>&1 | tee ../frontend-test.log
        continue-on-error: false

      # US-131 (OPS-012) frontend build：react-scripts build 校验生产包能编译。
      # 缺资源、import 报错、env 占位符不匹配在此立即暴露，避免到部署机才发现。
      # 跑完不上传产物（占空间且 dev 流程会自动产出），只关心 exit code。
      # DISABLE_ESLINT_PLUGIN：build 阶段 webpack 内嵌的 eslint 插件会把"任何
      # warning 升级成 error"（CI=true 行为）。lint job 已经单独跑 eslint 全量
      # 校验，build 这里不重复跑，避免一处 prettier warning 阻塞整个 PR。
      # 真正的"build break"（类型错误 / import 失败 / loader 报错）依然会触发。
      - name: Build (react-scripts build)
        id: build
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log
        continue-on-error: false

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: |
            frontend-typecheck.log
            frontend-typecheck-baseline-summary.json
            frontend-lint.log
            frontend-test.log
            frontend-build.log
          retention-days: 7

      - name: Comment on PR with errors
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logs = ['typecheck', 'lint', 'test', 'build'];
            const sections = [];
            for (const name of logs) {
              const filePath = path.join(process.env.GITHUB_WORKSPACE, `frontend-${name}.log`);
              if (!fs.existsSync(filePath)) continue;
              const content = fs.readFileSync(filePath, 'utf-8');
              const tail = content.split('\n').slice(-60).join('\n');
              sections.push(`<details><summary><b>frontend ${name}</b> (tail 60 lines)</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>`);
            }
            const body = `## ❌ Frontend CI failed\n\n${sections.join('\n\n')}\n\n_See full logs in [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # --------------------------------------------------------------------------
  # US-131 (OPS-012) docker-check: docker compose config 校验
  # docker-compose.yml 有占位符 ${POSTGRES_PASSWORD:?...}，CI 注入合法值后跑
  # `docker compose config` 验证 YAML 语法 + 占位替换 + 服务声明无 typo。
  # 当前仓库没有 backend/frontend Dockerfile（生产用宿主 npm build + node 运行，
  # 见 docs/deployment_topology.md），所以这里不 build image，仅 validate compose。
  # 一旦后续补 Dockerfile，把 `docker buildx build --load` 加进同一 job 即可。
  # --------------------------------------------------------------------------
  docker-check:
    name: Docker compose validate
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        id: compose_validate
        env:
          # 给占位符喂一个 CI-only 假值，让 ${POSTGRES_PASSWORD:?...} 不 fail；
          # 这个值仅用于 `compose config` 解析，从不真正起容器。
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml config 2>&1 | tee docker-compose-config.log
          # docker compose config 退出码 0 = YAML / 占位符 / 服务声明全合法
          # 任何 typo / env 占位符未填 / volumes 引用错都会 != 0
          echo "compose config OK"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker-compose-config.log
          retention-days: 7

      - name: Comment on PR with errors
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const filePath = path.join(process.env.GITHUB_WORKSPACE, 'docker-compose-config.log');
            const tail = fs.existsSync(filePath)
              ? fs.readFileSync(filePath, 'utf-8').split('\n').slice(-60).join('\n')
              : '(log missing)';
            const body = `## ❌ Docker compose validate failed\n\n<details><summary><b>docker compose config</b> (tail 60 lines)</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n\n_See full logs in [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
